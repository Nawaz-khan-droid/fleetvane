# ──────────────────────────────────────────────────
# FleetVane Application Configuration
# ──────────────────────────────────────────────────

spring:
  application:
    name: fleetvane
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  # ── JPA / Hibernate ──
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  # ── Datasource (Supabase PostgreSQL via Pooler) ──
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000

  # ── Flyway Migrations ──
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Jackson ──
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# ── JWT Configuration ──
fleetvane:
  jwt:
    # NO fallback: Spring fails startup if JWT_SECRET is not set in the environment.
    # SecuritySanityConfig additionally rejects blank/short/known-default values.
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000       # 15 minutes
    refresh-token-expiration-ms: 604800000   # 7 days

  # ── CORS ──
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  # Demo simulation is isolated from real customer fleets.
  simulation:
    demo-company-id: ${SIMULATION_DEMO_COMPANY_ID:1}
    demo-distance-per-tick-km: ${SIMULATION_DEMO_DISTANCE_PER_TICK_KM:1.0}

  ratelimit:
    enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
    capacity: ${AUTH_RATE_LIMIT_CAPACITY:20}
    refill-minutes: ${AUTH_RATE_LIMIT_REFILL_MINUTES:1}

# ── Actuator & Observability ──
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
    metrics:
      enabled: true

# ── Server ──
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

# ── OSRM Routing Engine ──
routing:
  osrm:
    base-url: ${OSRM_BASE_URL:https://router.project-osrm.org}

# ── Logging ──
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [CorrelationID: %X{correlationId:-NONE}] %logger{36} - %msg%n"
  level:
    com.fleetvane: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
