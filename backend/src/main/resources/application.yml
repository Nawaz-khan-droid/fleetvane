# ──────────────────────────────────────────────────
# FleetVane Application Configuration
# ──────────────────────────────────────────────────

spring:
  application:
    name: fleetvane
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  # ── JPA / Hibernate ──
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  # ── Datasource (Supabase PostgreSQL via Pooler) ──
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000

  # ── Flyway Migrations ──
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Jackson ──
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# ── JWT Configuration ──
fleetvane:
  jwt:
    secret: ${JWT_SECRET:fleetvane-capstone-jwt-secret-key-2026-minimum-256-bits-required}
    access-token-expiration-ms: 900000       # 15 minutes
    refresh-token-expiration-ms: 604800000   # 7 days

  # ── CORS ──
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ── Actuator & Observability ──
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true

# ── Server ──
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# ── Logging ──
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [CorrelationID: %X{correlationId:-NONE}] %logger{36} - %msg%n"
  level:
    com.fleetvane: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: DEBUG
